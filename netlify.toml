[build]
  command = "if [ ! -d \"flutter\" ]; then git clone https://github.com/flutter/flutter.git -b 3.41.7 --depth 1; fi; export PATH=\"$PATH:$(pwd)/flutter/bin\" && flutter build web --release --dart-define=API_BASE_URL=https://nt-material-management-sys-api.onrender.com/api"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
